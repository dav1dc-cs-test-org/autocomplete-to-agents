name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q --cov=freightline --cov-report=term-missing

      - name: Smoke test the CLI
        run: |
          freightline carriers
          freightline --db "$RUNNER_TEMP/ci.db" migrate
          freightline --db "$RUNNER_TEMP/ci.db" quote \
            --carrier atlas --service ground --from 94105 --to 10001 --weight 2.5

      - name: Check the OpenAPI document still generates
        run: |
          python -c "from freightline.api.app import create_app; assert create_app().openapi()['paths']"
